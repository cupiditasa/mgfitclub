<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, follow"><title>تنظیم خدمات مربی | MG</title>
  <style id="mg-access-cloak">body{visibility:hidden}</style>
  <link rel="stylesheet" href="mg-role-theme.css"><link rel="stylesheet" href="coach-market.css">
</head>
<body><main class="market">
  <header class="market-head"><h1>خدمات و صفحهٔ مربی</h1><nav><a href="coach-dashboard.html">داشبورد مربی</a> · <a href="coach-requests.html">درخواست‌ها</a></nav></header>
  <p id="market-message" class="message" role="status" aria-live="polite">در حال بررسی دسترسی…</p>
  <section class="market-panel"><form id="offers-form" class="market-form">
    <div class="switches"><label><input id="workout-enabled" type="checkbox"> پذیرش درخواست برنامهٔ تمرینی</label><label><input id="nutrition-enabled" type="checkbox"> پذیرش درخواست برنامهٔ غذایی</label><label><input id="inperson-enabled" type="checkbox"> پذیرش درخواست مربی حضوری</label></div>
    <label>تخصص کوتاه<input id="specialty" maxlength="140" placeholder="مثلاً مربی بدنسازی و آمادگی جسمانی"></label>
    <label>معرفی مربی<textarea id="bio" maxlength="3000" placeholder="معرفی، سابقه و رویکرد تمرینی شما"></textarea></label>
    <label>نشانی تصویر کاور (اختیاری)<input id="hero-image" type="url" maxlength="500" placeholder="https://…"></label>
    <div><h2>پکیج‌های برنامهٔ تمرینی</h2><div id="workout-packages"></div><button id="add-workout" type="button">＋ افزودن پکیج تمرینی</button></div>
    <div><h2>پکیج‌های مربی حضوری</h2><div id="inperson-packages"></div><button id="add-inperson" type="button">＋ افزودن پکیج حضوری</button></div>
    <button class="primary" type="submit">ذخیرهٔ تنظیمات و صفحهٔ مربی</button>
  </form></section>
</main><script src="mg-role-theme.js"></script><script src="mg-api.js?v=20260919-access"></script><script src="coach-offerings.js"></script></body></html>
