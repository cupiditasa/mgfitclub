<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>مشاهده برنامه تمرینی | MG FitClub</title>
    <style>
      :root {
        --p: #713de2;
        --green: #2dcc75;
        --yellow: #f7ca55;
        --ink: #625d92;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--p);
        font-family: Tahoma, "Segoe UI", sans-serif;
        color: var(--ink);
      }
      .app {
        max-width: 760px;
        margin: auto;
        min-height: 100vh;
      }
      .top {
        height: 116px;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 34px;
      }
      .top h1 {
        font-size: 27px;
        font-weight: 500;
        margin: 0;
      }
      .icon {
        border: 0;
        background: none;
        color: #fff;
        font-size: 48px;
        cursor: pointer;
      }
      .shell {
        background: #fff;
        border-radius: 44px 44px 0 0;
        min-height: calc(100vh - 116px);
        padding: 30px 20px 36px;
      }
      .days {
        display: flex;
        gap: 8px;
        overflow: auto;
        padding: 0 4px 26px;
        scrollbar-width: none;
      }
      .days::-webkit-scrollbar {
        display: none;
      }
      .day {
        border: 0;
        background: transparent;
        color: #5d578b;
        padding: 12px 15px;
        border-radius: 14px;
        white-space: nowrap;
        font-size: 16px;
        cursor: pointer;
      }
      .day.active {
        background: #ff655a;
        color: #fff;
        font-weight: bold;
      }
      .program {
        background: var(--p);
        border-radius: 40px;
        padding: 28px 20px 24px;
        color: #fff;
        box-shadow: 0 14px 30px #45229b44;
      }
      .program-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .program h2 {
        font-size: 23px;
        margin: 0 0 22px;
      }
      .underline {
        height: 5px;
        width: 74px;
        background: #5427b6;
        border-radius: 8px;
        margin: -14px 0 20px auto;
      }
      .labels {
        display: grid;
        grid-template-columns: 1fr 80px 80px 72px;
        gap: 8px;
        color: #efeaff;
        font-size: 15px;
        padding: 0 8px 12px;
      }
      .exercise {
        background: #fff;
        color: var(--ink);
        border-radius: 25px;
        padding: 18px 16px;
        margin: 12px 0;
        cursor: pointer;
        box-shadow: 0 8px 15px #3d1a9333;
      }
      .exercise.collapsed {
        background: #e5dcfa;
        color: #8179a8;
        box-shadow: none;
      }
      .exercise-row {
        display: grid;
        grid-template-columns: 1fr 58px 58px 58px;
        align-items: center;
        gap: 8px;
      }
      .exercise h3 {
        font-size: 18px;
        margin: 0;
      }
      .num {
        border: 2px solid #eee;
        border-radius: 15px;
        text-align: center;
        padding: 8px 3px;
        font-size: 20px;
      }
      .play {
        width: 52px;
        height: 52px;
        border: 0;
        border-radius: 16px;
        background: var(--yellow);
        color: #fff;
        font-size: 27px;
        cursor: pointer;
      }
      .details {
        display: none;
        border-top: 1px solid #eee;
        margin-top: 15px;
        padding-top: 15px;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .exercise.open .details {
        display: grid;
      }
      .metric {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        flex-direction: column;
      }
      .circle {
        width: 92px;
        height: 92px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 27px;
        border: 7px dotted #71679f;
        outline: 6px solid #fff;
        outline-offset: -12px;
      }
      .circle.green {
        background: var(--green);
      }
      .circle.coral {
        background: #ff645b;
      }
      .metric small {
        font-size: 13px;
      }
      .timer {
        background: #fff;
        border-radius: 36px;
        margin-top: 24px;
        padding: 23px 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        box-shadow: 0 8px 18px #32157522;
      }
      .clock {
        font-size: 58px;
        color: #5725ca;
      }
      .time {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .time b {
        font-size: 25px;
        border: 2px solid #e7e4ee;
        border-radius: 14px;
        padding: 8px 13px;
        color: #6f6a8e;
      }
      .time small {
        margin-top: 5px;
      }
      .controls {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
      }
      .controls button {
        border: 2px solid #c9c6d1;
        background: #fff;
        border-radius: 18px;
        padding: 13px 18px;
        color: #817c93;
        font-size: 15px;
        cursor: pointer;
      }
      .controls .main {
        background: var(--green);
        border-color: var(--green);
        color: #fff;
        font-size: 32px;
        width: 150px;
        padding: 7px;
      }
      .back {
        display: block;
        text-align: center;
        color: #fff;
        background: #5b2ec7;
        border-radius: 14px;
        padding: 12px;
        margin: 22px auto 0;
        max-width: 260px;
        text-decoration: none;
      }
      @media (max-width: 520px) {
        .top {
          height: 96px;
          padding: 15px 22px;
        }
        .top h1 {
          font-size: 22px;
        }
        .shell {
          min-height: calc(100vh - 96px);
          padding: 24px 12px;
        }
        .labels {
          grid-template-columns: 1fr 56px 56px 56px;
          font-size: 12px;
        }
        .exercise-row {
          grid-template-columns: 1fr 50px 50px 52px;
        }
        .exercise h3 {
          font-size: 16px;
        }
        .program {
          border-radius: 32px;
          padding: 23px 12px;
        }
        .timer {
          gap: 10px;
        }
        .controls button {
          padding: 11px 10px;
          font-size: 13px;
        }
        .controls .main {
          width: 110px;
        }
      }
    </style>
    <link rel="stylesheet" href="panel-theme.css?v=20260829" />
    <link rel="stylesheet" href="athlete-shared-theme.css?v=20260906" />
    <link rel="stylesheet" href="tabs-modern.css?v=20260907" />
  </head>
  <body data-page-theme="workout">
    <script src="athlete-shared-theme.js?v=20260906"></script>
    <div class="app">
      <header class="top">
        <button class="icon" id="backTop">‹</button>
        <h1>مشاهده برنامه تمرینی</h1>
        <button class="icon" onclick="location.href = 'account.html'">
          ☰
        </button>
      </header>
      <main class="shell">
        <nav class="days" id="days"></nav>
        <section class="program">
          <div class="program-head">
            <h2 id="dayTitle">تمرین‌های شنبه من</h2>
            <span>برنامه فعال</span>
          </div>
          <div class="underline"></div>
          <div class="labels">
            <span>تمرین</span><span>ست</span><span>تکرار</span
            ><span>آموزش</span>
          </div>
          <div id="exercises"></div>
        </section>
        <section class="timer">
          <div class="time"><b id="hours">۰</b><small>ساعت</small></div>
          <div class="time"><b id="minutes">۰</b><small>دقیقه</small></div>
          <div class="time"><b id="seconds">۰۰</b><small>ثانیه</small></div>
          <span class="clock">◴</span>
        </section>
        <div class="controls">
          <button id="prev">تمرین قبلی ‹</button
          ><button class="main" id="toggle">▶</button
          ><button id="next">› تمرین بعدی</button>
        </div>
        <a class="back" id="backLink" href="#">بازگشت به پنل</a>
      </main>
    </div>
    <script src="mg-api.js?v=20260911"></script>
    <script src="tabs-modern.js?v=20260907"></script>
    <script>
      const p = new URLSearchParams(location.search),
        role =
          p.get("demo") === "coach"
            ? "coach"
            : localStorage.getItem("mg_role") || "athlete";
      if (!p.get("demo") && !localStorage.getItem("mg_session"))
        location.href = "account.html";
      const fa = (n) => String(n).replace(/\d/g, (d) => "۰۱۲۳۴۵۶۷۸۹"[d]),
        days = [
          "شنبه",
          "یکشنبه",
          "دوشنبه",
          "سه‌شنبه",
          "چهارشنبه",
          "پنجشنبه",
          "جمعه",
        ],
        data = {
          شنبه: [
            ["پشت پا ایستاده", 3, 10, 59],
            ["پشت پا خوابیده", 3, 8, 45],
            ["پشت پا لانچ", 2, 12, 60],
          ],
          یکشنبه: [["گرم‌کردن و کشش", 2, 12, 40]],
          دوشنبه: [
            ["جفت پا", 4, 15, 60],
            ["اسکوات", 3, 10, 55],
          ],
          سه‌شنبه: [["سرشانه دمبل", 3, 12, 50]],
          چهارشنبه: [["پرس سینه", 4, 10, 60]],
          پنجشنبه: [["پلانک", 3, 30, 45]],
          جمعه: [],
        };
      let day = "شنبه",
        index = 0,
        elapsed = 0,
        running = false,
        timerId;
      const daysEl = document.querySelector("#days"),
        list = document.querySelector("#exercises");
      days.forEach((d) => {
        const b = document.createElement("button");
        b.className = "day" + (d === day ? " active" : "");
        b.textContent = d;
        b.onclick = () => {
          day = d;
          index = 0;
          render();
        };
        daysEl.appendChild(b);
      });
      function render() {
        document
          .querySelectorAll(".day")
          .forEach((b) => b.classList.toggle("active", b.textContent === day));
        document.querySelector("#dayTitle").textContent = `تمرین‌های ${day} من`;
        const items = data[day] || [];
        list.innerHTML = items.length
          ? items
              .map(
                (x, i) =>
                  `<article class="exercise ${i === index ? "open" : "collapsed"}" data-i="${i}"><div class="exercise-row"><h3>${x[0]}</h3><span class="num">${fa(x[1])}</span><span class="num">${fa(x[2])}</span><button class="play" data-play="${i}">▷</button></div><div class="details"><div class="metric"><div class="circle green">${fa(x[2])}</div><small>تکرار هر ست</small></div><div class="metric"><div class="circle coral">${fa(x[3])}″</div><small>زمان کل تمرین</small></div></div></article>`,
              )
              .join("")
          : `<div style="text-align:center;padding:38px 8px;color:#eee">برای این روز تمرینی ثبت نشده است.</div>`;
        list.querySelectorAll(".exercise").forEach(
          (el) =>
            (el.onclick = (e) => {
              if (e.target.closest("[data-play]")) {
                alert("ویدیوی آموزش این حرکت به‌زودی اضافه می‌شود.");
                return;
              }
              index = +el.dataset.i;
              render();
            }),
        );
      }
      function update() {
        let s = elapsed % 60,
          m = Math.floor(elapsed / 60) % 60,
          h = Math.floor(elapsed / 3600);
        hours.textContent = fa(h);
        minutes.textContent = fa(m);
        seconds.textContent = fa(String(s).padStart(2, "0"));
      }
      toggle.onclick = () => {
        running = !running;
        toggle.textContent = running ? "❚❚" : "▶";
        if (running)
          timerId = setInterval(() => {
            elapsed++;
            update();
          }, 1000);
        else clearInterval(timerId);
      };
      prev.onclick = () => {
        if (index > 0) {
          index--;
          render();
        }
      };
      next.onclick = () => {
        if (index < (data[day] || []).length - 1) {
          index++;
          render();
        }
      };
      const back =
        role === "coach"
          ? "coach-dashboard.html?demo=coach"
          : "dashboard.html?demo=athlete";
      backTop.onclick = () => (location.href = back);
      backLink.href = back;
      render();
      update();
    </script>
  </body>
</html>
