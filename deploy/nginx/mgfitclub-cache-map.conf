# Included from nginx's http{} context (for example /etc/nginx/conf.d/).
# Only MG's static locations consume this variable; API and Lena vhosts do not.
# Unversioned files get a week to reduce repeat downloads; ?v= URLs get a year.
map $arg_v $mgfitclub_static_expires {
    default 7d;
    ~.+ 1y;
}
