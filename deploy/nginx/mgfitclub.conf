# MG FitClub production vhost. Install as /etc/nginx/sites-available/mgfitclub-staging.
# Root and www DNS-only records resolve to the VPS; Worker subdomains are unchanged.
server {
    listen 80;
    listen [::]:80;
    server_name mgfitclub.ir www.mgfitclub.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mgfitclub.ir www.mgfitclub.ir;

    root /opt/mgfitclub/current/site;
    index index.html;
    client_max_body_size 10m;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/mgfitclub/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mgfitclub/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MGSSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /api/api01/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
