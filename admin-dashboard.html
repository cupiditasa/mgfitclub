<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>داشبورد باشگاه | MG FitClub</title>
    <style>
      :root {
        --p: #713de2;
        --green: #27c879;
        --yellow: #f7ca55;
        --cyan: #22cbe0;
        --ink: #77727f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--p);
        font-family: Tahoma, "Segoe UI", sans-serif;
        color: var(--ink);
      }
      .app {
        max-width: 760px;
        margin: auto;
        min-height: 100vh;
      }
      .hero {
        height: 230px;
        color: #fff;
        padding: 22px 30px;
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(#713de2dd, #713de2f5),
          url("assets/images/gym-01.webp") center/cover;
      }
      .top {
        display: flex;
        justify-content: space-between;
      }
      .icon {
        border: 0;
        background: none;
        color: #fff;
        font-size: 46px;
        cursor: pointer;
      }
      .hero h1 {
        font-size: 28px;
        margin: 35px 0 4px;
      }
      .hero p {
        margin: 0;
      }
      .badge {
        position: absolute;
        left: 28px;
        bottom: 30px;
        width: 75px;
        height: 75px;
        border: 4px solid #fff;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 25px;
        background: #713de299;
      }
      .shell {
        background: #fff;
        border-radius: 40px 40px 0 0;
        margin-top: -1px;
        min-height: calc(100vh - 230px);
        padding: 22px 20px 70px;
      }
      .quick {
        background: #fafafa;
        border-radius: 22px;
        padding: 16px;
        margin-bottom: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .quick b {
        font-size: 20px;
        font-weight: 400;
      }
      .mini {
        width: 50px;
        height: 50px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 28px;
      }
      .yellow {
        background: var(--yellow);
      }
      .cyan {
        background: var(--cyan);
      }
      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin: 16px 58px;
      }
      .stat {
        background: var(--p);
        color: #fff;
        border-radius: 21px;
        padding: 20px 10px;
        text-align: center;
        box-shadow: 0 8px 15px #45229b33;
      }
      .stat strong {
        display: block;
        font-size: 28px;
        margin: 10px;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin: 16px 0;
      }
      .feature {
        background: #fafafa;
        border-radius: 19px;
        padding: 18px;
        text-align: center;
        cursor: pointer;
      }
      .feature .mini {
        margin: auto;
        background: #ccc;
        color: #fff;
      }
      .news {
        background: #fafafa;
        border-radius: 19px;
        padding: 15px;
        margin-top: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .news button {
        border: 0;
        background: var(--green);
        color: #fff;
        border-radius: 13px;
        padding: 12px 18px;
        font: inherit;
      }
      .bottom {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: min(760px, 100%);
        background: var(--p);
        height: 58px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        color: #fff;
        font-size: 25px;
      }
      .bottom a {
        color: #fff;
        text-decoration: none;
      }
      .back {
        display: block;
        text-align: center;
        background: #5b2ec7;
        color: #fff;
        text-decoration: none;
        border-radius: 14px;
        padding: 12px;
        margin: 22px auto;
        max-width: 230px;
      }
      @media (max-width: 520px) {
        .hero {
          height: 205px;
          padding: 18px 22px;
        }
        .hero h1 {
          font-size: 24px;
          margin-top: 32px;
        }
        .shell {
          padding: 18px 12px 70px;
        }
        .cards {
          margin: 14px 42px;
          gap: 12px;
        }
        .stat {
          padding: 16px 6px;
        }
        .stat strong {
          font-size: 23px;
        }
        .quick b {
          font-size: 16px;
        }
        .row {
          gap: 10px;
        }
      }
    </style>
    <link rel="stylesheet" href="panel-theme.css?v=20260829" />
    <link rel="stylesheet" href="mg-role-theme.css?v=20260906" />
    <link rel="stylesheet" href="admin-orbit-ui.css?v=20260906" />
  </head>
  <body data-role="manager">
    <script src="mg-role-theme.js?v=20260906"></script>
    <script src="mg-api.js?v=20260911"></script>
    <div class="app">
      <header class="hero">
        <div class="top">
          <button class="icon" id="back">‹</button
          ><button class="icon" onclick="location.href = 'account.html'">
            ☰
          </button>
        </div>
        <h1>باشگاه ویوا</h1>
        <p>(ویرایش پروفایل)</p>
        <div class="badge">VIVA</div>
      </header>
      <main class="shell">
        <section id="adminOrbit" aria-label="دسترسی‌های مدیریت">
          <a class="admin-orbit-center" href="admin.html?demo=manager"
            ><span
              ><span class="admin-orbit-icon">◈</span><b>مدیریت کامل</b
              ><small>مرکز کنترل باشگاه</small></span
            ></a
          >
          <a
            class="admin-orbit-item"
            style="--a: 0deg; --r: 220px"
            href="admin.html?demo=manager"
            ><span
              ><span class="admin-orbit-icon">♙</span>ورزشکاران<br /><small
                >۳۵۶ نفر</small
              ></span
            ></a
          >
          <a
            class="admin-orbit-item"
            style="--a: 72deg; --r: 220px"
            href="admin.html?demo=manager"
            ><span
              ><span class="admin-orbit-icon">♧</span>مربیان<br /><small
                >۶۸ نفر</small
              ></span
            ></a
          >
          <a
            class="admin-orbit-item"
            style="--a: 144deg; --r: 220px"
            href="admin-transactions.html?demo=manager"
            ><span
              ><span class="admin-orbit-icon">▣</span>تراکنش‌ها<br /><small
                >امروز</small
              ></span
            ></a
          >
          <a
            class="admin-orbit-item"
            style="--a: 216deg; --r: 220px"
            href="admin.html?demo=manager"
            ><span
              ><span class="admin-orbit-icon">▤</span>ورود و خروج<br /><small
                >حضور و غیاب</small
              ></span
            ></a
          >
          <a
            class="admin-orbit-item"
            style="--a: 288deg; --r: 220px"
            href="admin.html?demo=manager"
            ><span
              ><span class="admin-orbit-icon">▧</span>گالری تصاویر<br /><small
                >باشگاه</small
              ></span
            ></a
          >
        </section>
        <div class="news">
          <span>همه اخبار باشگاه : <b>۷۶۰ خبر</b></span
          ><button onclick="alert('فرم خبر جدید باز شد')">＋ خبر جدید</button>
        </div>
        <a class="back" href="admin.html?demo=manager">ورود به مدیریت کامل</a>
      </main>
      <nav class="bottom">
        <a href="admin-dashboard.html?demo=manager">⌂</a
        ><a href="admin.html?demo=manager">♙</a
        ><a href="admin-transactions.html?demo=manager">▣</a
        ><a href="admin.html?demo=manager">▤</a
        ><a href="admin-dashboard.html?demo=manager">داشبورد</a>
      </nav>
    </div>
    <script>
      const p = new URLSearchParams(location.search);
      if (p.get("demo") !== "manager" && !localStorage.getItem("mg_session"))
        location.href = "account.html";
      back.onclick = () => (location.href = "admin.html?demo=manager");
    </script>
  </body>
</html>
