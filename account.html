<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <base href="/" />
    <meta name="theme-color" content="#080a08" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/brand/mg-mark-acid.webp" />
    <script>window.MG_API_BASE = "https://api.mgfitclub.ir";</script>
    <script src="mg-api.js?v=20261010-offline-continuity"></script>
    <title>ورود | MG FitClub</title>
    <style>
      @font-face {
        font-family: "B Esfehan";
        src: url("./assets/fonts/B-Esfehan-Bold.ttf?v=20260828")
          format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --bg: #080a08;
        --panel: #11150f;
        --line: #39402f;
        --text: #f6f7f2;
        --muted: #aab2a2;
        --lime: #c6ff3f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 15% 10%, #1b2414 0, #080a08 45%);
        color: var(--text);
        font-family: "B Esfehan", Tahoma, sans-serif;
      }
      .card {
        width: min(94vw, 520px);
        padding: 30px;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: rgba(17, 21, 15, 0.96);
        box-shadow: 0 24px 80px #0008;
      }
      .brand {
        color: var(--lime);
        letter-spacing: 0.12em;
        font-size: 12px;
      }
      .back {
        float: left;
        color: var(--muted);
        text-decoration: none;
      }
      .muted {
        color: var(--muted);
        line-height: 1.9;
      }
      .field {
        width: 100%;
        padding: 14px 15px;
        margin-top: 10px;
        border: 1px solid #59634a;
        border-radius: 10px;
        background: #080a08;
        color: var(--text);
        font: inherit;
      }
      .button {
        width: 100%;
        padding: 14px;
        margin-top: 12px;
        border: 0;
        border-radius: 10px;
        background: var(--lime);
        color: #10140c;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .button.ghost {
        background: transparent;
        color: var(--text);
        border: 1px solid #59634a;
      }
      .roles[hidden],#roleToggle[hidden],.staff-entry[hidden] { display: none !important; }
      .staff-entry {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 34px; margin-top: 10px; padding: 6px 11px;
        border: 1px solid #59634a; border-radius: 9px; color: var(--muted);
        text-decoration: none; font-size: 12px;
      }
      .staff-entry:hover { border-color: var(--lime); color: var(--lime); }
      .roles {
        display: none;
        grid-template-columns: repeat(2, 1fr);
        gap: 9px;
        margin-top: 10px;
      }
      .roles.open {
        display: grid;
      }
      .role {
        padding: 12px;
        border: 1px solid #59634a;
        border-radius: 9px;
        background: #0b0e0a;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .role.active {
        border-color: var(--lime);
        color: var(--lime);
      }
      #code {
        display: none;
      }
      #status {
        min-height: 25px;
        margin: 15px 0 0;
        color: var(--lime);
      }
    </style>
    <style>
      .login-video-bg {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -3;
        background: #080a08;
      }
      .login-video-overlay {
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(
            circle at var(--pointer-x, 50%) var(--pointer-y, 50%),
            rgba(198, 255, 63, 0.12),
            transparent 24%
          ),
          linear-gradient(
            135deg,
            rgba(8, 10, 8, 0.86),
            rgba(8, 10, 8, 0.6) 55%,
            rgba(18, 28, 10, 0.82)
          );
        transition: background 0.18s ease;
      }
      .login-video-full {
        opacity: 0;
        transition: opacity 1.2s ease;
      }
      .login-video-full.ready {
        opacity: 1;
      }
      .login-video-intro.hidden {
        opacity: 0;
      }
      .card {
        position: relative;
        z-index: 1;
        background: rgba(17, 21, 15, 0.82);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-color: rgba(198, 255, 63, 0.3);
      }
      @media (max-width: 600px) {
        body { padding: 16px; }
        .card {
          width: 100%;
          max-width: 520px;
          padding: 22px 18px;
        }
        .login-video-overlay {
          background: linear-gradient(
            135deg,
            rgba(8, 10, 8, 0.9),
            rgba(8, 10, 8, 0.7)
          );
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .login-video-bg {
          display: none;
        }
        body {
          background: #080a08;
        }
      }
    </style>
  <meta name="robots" content="noindex, follow">
</head>
  <body>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("./sw.js"),
        );
      }
    </script>
    <video
      class="login-video-bg"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      poster="assets/video/login-poster.jpg"
      aria-hidden="true"
    >
      <source src="assets/video/login-bg-progressive.mp4" type="video/mp4" />
    </video>
    <div class="login-video-overlay" aria-hidden="true"></div>
    <main class="card">
      <a class="back" href="index.html">بازگشت</a>
      <div class="brand">MG FITCLUB</div>
      <h1>ورود به حساب</h1>
      <p id="loginInstructions" class="muted">
        نقش خود را انتخاب کنید، سپس شمارهٔ موبایل و کد ورود را وارد کنید.
      </p>
      <button id="roleToggle" class="button ghost" type="button" hidden>
        انتخاب نقش: ورزشکار
      </button>
      <div id="roles" class="roles" hidden>
        <button class="role active" data-role="athlete" type="button">
          ورزشکار</button
        ><button class="role" data-role="coach" type="button">مربی</button
        ><button class="role" data-role="manager" type="button">مدیریت</button
        ><button class="role" data-role="secretary" type="button">منشی</button
        ><button class="role" data-role="support" type="button">
          پشتیبان فنی
        </button>
      </div>
      <p id="approvalNotice" role="alert" hidden style="color:#e6d891;line-height:1.9;border:1px solid #726c36;padding:12px;border-radius:12px">
        درخواست شما برای باشگاه MG ثبت می‌شود. پس از تأیید شماره، برای بررسی به مدیریت باشگاه MG می‌رود؛ دسترسی پس از تأیید مدیر باز می‌شود.
      </p>
      <label for="target">شمارهٔ موبایل</label><input
        id="target"
        class="field"
        type="tel"
        inputmode="numeric"
        dir="ltr"
        maxlength="16"
        aria-label="شمارهٔ موبایل"
        placeholder="مثال: 09123456789"
        autocomplete="tel"
        enterkeyhint="next"
      /><label for="code">کد ورود</label><input
        id="code"
        class="field"
        type="text"
        aria-label="کد ورود"
        placeholder="کد ورود"
        inputmode="numeric"
        autocomplete="one-time-code"
      /><button id="action" class="button" type="button">دریافت کد ورود</button>
      <p id="status" role="status" aria-live="polite"></p>
      <a id="staffEntry" class="staff-entry" href="https://mgfitclub.ir/staff/login">ورود ادمین</a>
      <a id="athleteEntry" class="staff-entry" href="https://mgfitclub.ir/account.html" hidden>ورود ورزشکار</a>
    </main>
    <script>
      (() => {
        const API = window.MG_API_BASE || "https://api.mgfitclub.ir",
          STAFF_LOGIN_URL = "https://mgfitclub.ir/staff/login",
          isStaffPortal = String(location.hostname || "").toLowerCase() === "staff.mgfitclub.ir" || /^\/staff\/login\/?$/.test(String(location.pathname || "")),
          $ = (id) => document.getElementById(id),
          target = $("target"),
          code = $("code"),
          action = $("action"),
          status = $("status"),
          roles = $("roles"),
          roleToggle = $("roleToggle");
        const persianDigits = "۰۱۲۳۴۵۶۷۸۹",
          normalizePhone = (value) => {
            let phone = String(value || "")
              .replace(/[۰-۹]/g, (digit) => String(persianDigits.indexOf(digit)))
              .replace(/[\s()-]/g, "");
            if (phone.startsWith("+98")) phone = "0" + phone.slice(3);
            if (phone.startsWith("0098")) phone = "0" + phone.slice(4);
            return phone;
          };
        let sent = false,
          busy = false,
          challengeId = "",
          selected = isStaffPortal ? "manager" : "athlete";
        const names = {
            admin: "مدیریت کل",
            athlete: "ورزشکار",
            coach: "مربی",
            manager: "مدیریت",
            secretary: "منشی",
            support: "پشتیبان فنی",
          },
          routes = {
            admin: "admin.html",
            athlete: "dashboard.html",
            coach: "coach-dashboard.html",
            manager: "admin.html",
            secretary: "secretary.html",
            support: "support.html",
          },
          set = (x) => (status.textContent = x),
          req = async (u, b) => {
            const r = await fetch(API + u, {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(b),
              }),
              d = await r.json().catch(() => ({}));
            if (!r.ok) throw Error(d.error || "خطای سرویس");
            return d;
          };
        Array.from(roles.querySelectorAll?.("[data-role]") || []).forEach((option) => {
          option.hidden = isStaffPortal ? option.dataset.role === "athlete" : option.dataset.role !== "athlete";
        });
        Array.from(roles.querySelectorAll?.(".role") || []).forEach((option) => option.classList.toggle("active", option.dataset.role === selected));
        roleToggle.hidden = !isStaffPortal;
        roles.hidden = !isStaffPortal;
        if (isStaffPortal) {
          $("loginInstructions").textContent = "نقش سازمانی خود را انتخاب کنید، سپس شمارهٔ موبایل و کد ورود را وارد کنید.";
          roleToggle.textContent = "انتخاب نقش: " + names[selected];
          $("staffEntry").hidden = true;
          $("athleteEntry").hidden = false;
          document.querySelector(".back").href = "https://mgfitclub.ir/";
        } else {
          $("loginInstructions").textContent = "برای ورود، شمارهٔ موبایل و کد یک‌بارمصرف را وارد کنید.";
        }
        roleToggle.onclick = () => roles.classList.toggle("open");
        target.addEventListener("input", () => {
          target.value = target.value.replace(/[^0-9۰-۹+()\s-]/g, "");
        });
        roles.onclick = (e) => {
          if (busy || sent) return;
          const b = e.target.closest("[data-role]");
          if (!b) return;
          selected = b.dataset.role;
          roles
            .querySelectorAll(".role")
            .forEach((x) => x.classList.toggle("active", x === b));
          roleToggle.textContent = "انتخاب نقش: " + names[selected];
          roles.classList.remove("open");
          const needsApproval = ["coach", "secretary"].includes(selected);
          $("approvalNotice").hidden = !needsApproval;
        };
        const login = async () => {
          if (busy) return;
          if (localStorage.getItem("mg_session")) return restore();
          const phone = normalizePhone(target.value);
          if (!/^09\d{9}$/.test(phone))
            return set("شمارهٔ موبایل معتبر وارد کنید؛ مثال: 09123456789.");
          target.value = phone;
          busy = true;
          action.disabled = true;
          try {
            if (!sent) {
              const d = await req(
                "/api/auth/request-code",
                { phone, role: selected, staffPortal: isStaffPortal && ["coach", "secretary"].includes(selected) },
              );
              sent = true;
              target.readOnly = true;
              roleToggle.disabled = true;
              challengeId = d.challengeId || "";
              code.style.display = "block";
              action.textContent = "ورود";
              set("کد ارسال شد." + (d.notice ? " " + d.notice : ""));
            } else {
              const d = await req(
                "/api/auth/verify-code",
                {
                  phone,
                  code: code.value.trim(),
                  role: selected,
                  challengeId,
                },
              );
              localStorage.setItem("mg_session", d.token);
              const actualRole = d.user?.role || "athlete";
              localStorage.setItem("mg_role", actualRole);
              await window.MGApi.rememberVerifiedUser(d.user);
              location.href = "/" + (routes[actualRole] || routes.athlete);
            }
          } catch (e) {
            set(window.MGApi.errorMessage(e));
          } finally {
            busy = false;
            action.disabled = false;
          }
        };
        const restore = async () => {
          if (busy) return;
          busy = true;
          action.disabled = true;
          set("در حال بررسی ورود قبلی…");
          try {
            const user = await window.MGApi.restoreSession();
            if (user) {
              if (!isStaffPortal && user.role !== "athlete") {
                await window.MGApi.logout();
                location.replace(STAFF_LOGIN_URL);
                return;
              }
              if (isStaffPortal && user.role === "athlete") {
                await window.MGApi.logout();
                location.replace("https://mgfitclub.ir/account.html");
                return;
              }
              location.replace("/" + (routes[user.role] || routes.athlete));
              return;
            }
            action.textContent = "دریافت کد ورود";
            set("برای ورود، شمارهٔ موبایل خود را وارد کنید.");
          } catch (error) {
            action.textContent = "تلاش دوباره برای ورود";
            set("بررسی حساب ممکن نشد. اتصال اینترنت را بررسی و دوباره تلاش کنید؛ ورود قبلی شما حفظ شده است.");
          } finally {
            busy = false;
            action.disabled = false;
          }
        };
        action.onclick = login;
        if (localStorage.getItem("mg_session")) restore();
        [target, code].forEach(
          (x) =>
            (x.onkeydown = (e) => {
              if (e.key === "Enter") {
                e.preventDefault();
                login();
              }
            }),
        );
      })();
    </script>
    <script>
      (() => {
        const video = document.querySelector(".login-video-bg"),
          card = document.querySelector(".card"),
          overlay = document.querySelector(".login-video-overlay");
        if (!video) return;
        let target = 0,
          current = 0,
          raf = 0,
          lastSeek = 0,
          active = false,
          dragging = false;
        const clamp = (n) => Math.max(0, Math.min(1, n));
        const render = () => {
          if (!active) {
            raf = 0;
            return;
          }
          current += (target - current) * 0.12;
          if (video.duration) {
            const t = Math.max(
                0.05,
                Math.min(video.duration - 0.05, current * video.duration),
              ),
              now = performance.now();
            if (
              !video.seeking &&
              now - lastSeek > 110 &&
              Math.abs(video.currentTime - t) > 0.08
            ) {
              video.currentTime = t;
              lastSeek = now;
            }
          }
          if (raf) raf = requestAnimationFrame(render);
        };
        const start = () => {
          if (!active) {
            active = true;
            video.pause();
            raf = requestAnimationFrame(render);
          }
        };
        const update = (e) => {
          if (e.pointerType === "touch" && !dragging) return;
          if (card && e.target.closest(".card")) return;
          const x = clamp(e.clientX / window.innerWidth),
            y = clamp(e.clientY / window.innerHeight);
          target = x;
          overlay?.style.setProperty("--pointer-x", `${x * 100}%`);
          overlay?.style.setProperty("--pointer-y", `${y * 100}%`);
          start();
        };
        document.addEventListener("pointermove", update, { passive: true });
        document.addEventListener(
          "pointerdown",
          (e) => {
            if (e.pointerType === "touch") {
              dragging = true;
              update(e);
            }
          },
          { passive: true },
        );
        const resume = () => {
          dragging = false;
          active = false;
          if (raf) {
            cancelAnimationFrame(raf);
            raf = 0;
          }
          video.play().catch(() => {});
        };
        document.addEventListener("pointerup", resume, { passive: true });
        document.addEventListener("pointercancel", resume, { passive: true });
        window.addEventListener("blur", resume);
      })();
    </script>
  </body>
</html>
